# This file is included inside nginx's http block, so these apply to every
# server below. Text responses (HTML, the JS/CSS bundles, API JSON, bot
# snapshots) used to go out uncompressed: main.js was 469KB instead of
# ~137KB, and the render-blocking CSS cost ~3s on a phone.
gzip on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied any;
gzip_types text/css text/javascript application/javascript application/json
           application/manifest+json application/xml text/xml image/svg+xml
           text/plain;

server {
    listen 80;
    server_name _;

    # ACME HTTP-01 challenge for Let's Encrypt issuance/renewal, served from
    # the shared webroot that the certbot container writes into.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else is redirected to HTTPS on the same host (keeps the
    # apex, www and the analytics subdomain each on their own https origin).
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name oda-interiors.com;

    ssl_certificate     /etc/letsencrypt/live/oda-interiors.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oda-interiors.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Admin photo uploads (incl. cropped images sent as PNG data-URLs) can be
    # several MB; the server accepts up to 15MB (multer), so nginx must not
    # reject them first with its 1MB default. Without this, cropping silently
    # fails with a 413 before the request ever reaches the server.
    client_max_body_size 20m;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Lets the prerender upstream (see @prerender) be
    # looked up per request instead of once at startup, so nginx still starts
    # and serves the site to people when the prerender container is down.
    resolver 127.0.0.11 valid=30s ipv6=off;

    location /api/ {
        proxy_pass http://server:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Adding a language translates the whole UI plus every existing
        # project via the Claude API, which can take longer than nginx's
        # default 60s proxy timeout.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Dynamic sitemap generated by the server (lists every published project).
    location = /sitemap.xml {
        proxy_pass http://server:3001/sitemap.xml;
        proxy_set_header Host $host;
    }

    # Project photos are edited/cropped in place (same filename, overwritten
    # on disk) via the admin panel. Without this, nginx sends only
    # Last-Modified/ETag with no Cache-Control, so browsers apply heuristic
    # caching and can keep serving a stale photo for a long time after a crop.
    # "no-cache" forces revalidation on every request (still 304s when the
    # file hasn't changed, so this isn't a "never cache" directive).
    location /img/main_imges_folder/ {
        add_header Cache-Control "no-cache";
    }

    # Downscaled WebP variants (server/imageVariants.js: "<file>.w480.webp"
    # etc.) are what the site actually loads. A short max-age saves the
    # revalidation round trip per photo on slow mobile connections, while
    # stale-while-revalidate means a re-cropped photo still refreshes within
    # the hour. (Regex locations beat the prefix location above.)
    location ~* ^/img/main_imges_folder/.+\.w[0-9]+\.webp$ {
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=604800";
    }

    # CRA emits content-hashed build assets (static/js/main.<hash>.js,
    # static/css/main.<hash>.css, media). The hash changes whenever the
    # content changes, so these files are immutable — cache them for a year
    # and skip revalidation entirely.
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The HTML shell — index.html directly, and every SPA route that falls
    # back to it via try_files — must revalidate, so a fresh deploy's new
    # hashed asset references are picked up immediately instead of a stale
    # cached shell pinning the old bundle. no-cache still 304s when unchanged.
    location / {
        add_header Cache-Control "no-cache";
        # No "$uri/" here on purpose: for the exact root path "/", that
        # would directory-match against the `index index.html` directive
        # and serve index.html straight away, skipping @prerender (and so
        # the bot check) entirely for the home page.
        try_files $uri @prerender;
    }

    # Search-engine/social-preview crawlers don't execute the React bundle,
    # so the raw SPA shell looks empty to them (see index.html: just
    # <div id="root">). Known bot user agents get proxied to the self-hosted
    # prerender service (docker-compose.yml), which renders the page in a
    # headless Chrome and returns full HTML; everyone else still gets
    # index.html and renders client-side as before.
    location @prerender {
        # The HTML shell served from here (and the bot snapshots, which
        # inherit this into the if-block) must revalidate too - the
        # add_header in "location /" doesn't reach a named location.
        add_header Cache-Control "no-cache";

        set $prerender 0;
        # Search and link-preview bots; Google's own testing tools (URL
        # Inspection and the Rich Results Test send "Google-InspectionTool",
        # not "Googlebot", so they used to show a different page than
        # Googlebot actually got); and AI-search crawlers, which don't run
        # JavaScript at all.
        if ($http_user_agent ~* "googlebot|google-inspectiontool|bingbot|yandex|baiduspider|duckduckbot|facebookexternalhit|twitterbot|linkedinbot|slackbot|telegrambot|whatsapp|viber|discordbot|applebot|embedly|quora link preview|pinterest|ia_archiver|gptbot|oai-searchbot|chatgpt-user|claudebot|claude-user|claude-searchbot|perplexitybot|perplexity-user") {
            set $prerender 1;
        }
        if ($uri ~* "\.(js|css|xml|less|png|jpg|jpeg|gif|pdf|doc|txt|ico|rss|zip|mp3|rar|exe|wmv|avi|ppt|mpg|mpeg|tif|wav|mov|psd|ai|xls|mp4|m4a|swf|dat|dmg|iso|flv|m4v|torrent|ttf|woff|woff2|svg|eot)$") {
            set $prerender 0;
        }

        # A slow or broken prerender must never cost a bot the page: any error
        # or timeout falls back to the plain SPA shell with a 200, which Google
        # can still render itself. (It used to be a 504 after 60s whenever
        # Chrome had been killed for lack of memory.)
        proxy_connect_timeout 3s;
        proxy_read_timeout 25s;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @spa;
        # A variable makes nginx resolve the name per request (see resolver).
        set $prerender_upstream http://prerender:3000;

        if ($prerender = 1) {
            rewrite .* /$scheme://$host$request_uri break;
            proxy_pass $prerender_upstream;
        }
        rewrite .* /index.html break;
    }

    location @spa {
        add_header Cache-Control "no-cache";
        rewrite .* /index.html break;
    }
}

# www is a plain 301 to the apex — the canonical tag (see Seo.jsx) already
# points there, but without this redirect nginx was serving both hosts with
# identical content on 200, so Google indexed www as a duplicate instead of
# honoring the tag.
server {
    listen 443 ssl;
    http2 on;
    server_name www.oda-interiors.com;

    ssl_certificate     /etc/letsencrypt/live/oda-interiors.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oda-interiors.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    return 301 https://oda-interiors.com$request_uri;
}

# Self-hosted Umami analytics on its own subdomain (the prebuilt image can't
# run under a subpath, so it gets a dedicated host at the root). Uses the same
# Let's Encrypt cert, which must include the analytics SAN.
server {
    listen 443 ssl;
    http2 on;
    server_name analytics.oda-interiors.com;

    ssl_certificate     /etc/letsencrypt/live/oda-interiors.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oda-interiors.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    location / {
        proxy_pass http://umami:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
