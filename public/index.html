<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <!-- data-rh="true" on the description/og/twitter tags below hands them to
         react-helmet-async (Seo.jsx), which replaces them with each page's
         own values. Without it every page carried two of each, and these
         site-wide defaults came first - share previews of a project showed
         the logo and the generic title. They stay here for the bare shell. -->
    <meta
      data-rh="true"
      name="description"
      content="ODA is an interior design and architecture studio based in Ukraine and working worldwide. We design apartments, private houses, and public interiors, from concept to finished space."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />

    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Self-hosted Umami analytics (privacy-friendly, no cookies). Auto-tracks
         SPA navigation. -->
    <script
      defer
      src="https://analytics.oda-interiors.com/script.js"
      data-website-id="6fa72150-b7eb-4e9d-82cf-c850b287c055"
    ></script>

    <title>ODA — Interior Design & Architecture Studio, Ukraine and Worldwide</title>

    <!-- Default Open Graph / Twitter tags (per-page values replace them at
         runtime via the Seo component - see data-rh above). -->
    <meta data-rh="true" property="og:type" content="website" />
    <meta data-rh="true" property="og:site_name" content="ODA" />
    <meta data-rh="true" property="og:title" content="ODA — Interior Design & Architecture Studio, Ukraine and Worldwide" />
    <meta data-rh="true" property="og:description" content="ODA is an interior design and architecture studio based in Ukraine and working worldwide. We design apartments, private houses, and public interiors, from concept to finished space." />
    <meta data-rh="true" property="og:url" content="https://oda-interiors.com/" />
    <meta data-rh="true" property="og:image" content="https://oda-interiors.com/logo512.png" />
    <meta data-rh="true" name="twitter:card" content="summary_large_image" />
    <meta data-rh="true" name="twitter:image" content="https://oda-interiors.com/logo512.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "ODA — Interior Design & Architecture Studio",
        "url": "https://oda-interiors.com",
        "image": "https://oda-interiors.com/logo512.png",
        "logo": "https://oda-interiors.com/logo512.png",
        "description": "Interior design and architecture studio based in Ukraine and working worldwide — apartments, private houses and public interiors from concept to finished space.",
        "email": "marynaprokhorova@gmail.com",
        "telephone": "+380676397018",
        "areaServed": "Worldwide",
        "address": { "@type": "PostalAddress", "addressCountry": "UA" },
        "sameAs": [
          "https://www.instagram.com/_svidoma_/",
          "https://t.me/marynaprokhorova_design"
        ]
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
